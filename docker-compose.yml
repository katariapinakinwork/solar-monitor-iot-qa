services:
  db:
    image: postgres:16-alpine
    container_name: solarmonitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarmonitor
      POSTGRES_USER: solaruser
      POSTGRES_PASSWORD: solarpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solaruser -d solarmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarmonitor_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=solarmonitor;Username=solaruser;Password=solarpass"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
